# Local development dependencies. See INFRASTRUCTURE.md.
name: n2f-nest

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N2F_POSTGRES_DB:-n2f}
      POSTGRES_USER: ${N2F_POSTGRES_USER:-n2f}
      POSTGRES_PASSWORD: ${N2F_POSTGRES_PASSWORD:-n2f_local}
    ports:
      - "127.0.0.1:${N2F_POSTGRES_PORT:-7220}:5432"
    volumes:
      # PostgreSQL 18 places PGDATA in a versioned directory below this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${N2F_REDIS_PORT:-7221}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
    ports:
      - "127.0.0.1:${N2F_SMTP_PORT:-7225}:1025"
      - "127.0.0.1:${N2F_MAILPIT_UI_PORT:-7226}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  s3:
    image: chrislusf/seaweedfs:4.46
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
    environment:
      AWS_ACCESS_KEY_ID: ${N2F_S3_ACCESS_KEY:-n2f_access}
      AWS_SECRET_ACCESS_KEY: ${N2F_S3_SECRET_KEY:-n2f_secret_local}
      S3_BUCKET: ${N2F_S3_BUCKET:-n2f-local}
    ports:
      - "127.0.0.1:${N2F_S3_PORT:-7230}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  observability:
    image: grafana/otel-lgtm:0.32.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${N2F_GRAFANA_USER:-n2f}
      GF_SECURITY_ADMIN_PASSWORD: ${N2F_GRAFANA_PASSWORD:-n2f_local}
      LGTM_SHUTDOWN_TIMEOUT_SECONDS: "20"
    ports:
      - "127.0.0.1:${N2F_GRAFANA_PORT:-7240}:3000"
      - "127.0.0.1:${N2F_OTLP_GRPC_PORT:-7241}:4317"
      - "127.0.0.1:${N2F_OTLP_HTTP_PORT:-7242}:4318"
    volumes:
      - observability_data:/data
      - ./config/observability/healthcheck.sh:/etc/n2f/observability-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/etc/n2f/observability-healthcheck.sh"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  s3_data:
  observability_data:
